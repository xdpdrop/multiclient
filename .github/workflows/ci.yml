name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "const expected = 'v' + require('./package.json').version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error('Tag must match package.json version (' + expected + ')');"
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          # @electron/get via env-paths: ~/.cache/electron, ~/Library/Caches/electron,
          # and %LOCALAPPDATA%\electron\Cache. A transient HTTP 500 leaves the zip here.
          path: ${{ runner.os == 'Windows' && format('{0}\electron\Cache', env.LOCALAPPDATA) || (runner.os == 'macOS' && format('{0}/Library/Caches/electron', env.HOME) || format('{0}/.cache/electron', env.HOME)) }}
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-
      - name: Install dependencies
        shell: bash
        run: |
          set -eu
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            echo "npm ci failed on attempt ${attempt}"
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            rm -rf node_modules
            sleep $((attempt * 5))
          done
      - name: Configure Electron sandbox
        if: runner.os == 'Linux'
        run: |
          # Electron aborts unless chrome-sandbox is owned by root and mode 4755.
          # This is CI setup only. The smoke script does not pass --no-sandbox.
          sandbox="node_modules/electron/dist/chrome-sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      - name: Install a window manager
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openbox
      # Local `npm run check` stays one chain. CI splits it so a failure still runs
      # the later steps. success() || failure() does not match cancelled. A failed
      # step still fails the job. Linux runs each step under Xvfb + Openbox.
      - name: Typecheck
        shell: bash
        run: bash scripts/ci-step.sh npm run typecheck
      - name: Unit tests
        if: success() || failure()
        shell: bash
        run: bash scripts/ci-step.sh npm test
      - name: Build
        if: success() || failure()
        shell: bash
        run: bash scripts/ci-step.sh npm run build
      - name: Integration scripts
        if: success() || failure()
        shell: bash
        run: bash scripts/ci-step.sh bash -lc "node scripts/test-storage.cjs && node scripts/test-history.cjs && node scripts/test-features.cjs && node scripts/test-comparison.cjs && node scripts/test-artifacts.cjs"
      - name: Smoke
        if: success() || failure()
        shell: bash
        run: bash scripts/ci-step.sh node scripts/test-web-worker.cjs
      - name: Playwright
        if: success() || failure()
        shell: bash
        run: bash scripts/ci-step.sh npx playwright test
      - run: npm run pack
        if: runner.os != 'Windows'
      - name: Build Windows zip
        if: runner.os == 'Windows'
        run: npx electron-builder --win zip --x64 --publish never
      - name: Verify packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MULTICLIENT_PACKAGED_PATH = Join-Path $PWD 'release/win-unpacked/Multiclient.exe'
          npx playwright test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify zip launch and restart
        if: runner.os == 'Windows'
        run: node scripts/test-portable.cjs
      - name: Create checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath release/Multiclient-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Multiclient-win-x64.zip" | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Multiclient-Windows-x64
          path: |
            release/Multiclient-win-x64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results
  # Compares the published v0.1.0 portable EXE with this branch's zip.
  # github.head_ref limits it to the pull request that introduces the zip.
  startup-timing:
    if: github.head_ref == 'cursor/windows-zip-startup-37be'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: ${{ format('{0}\electron\Cache', env.LOCALAPPDATA) }}
          key: electron-Windows-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-Windows-
      - name: Download v0.1.0 portable EXE
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          mkdir -p before
          gh release download v0.1.0 --pattern Multiclient.exe --dir before
          gh release download v0.1.0 --pattern SHA256SUMS.txt --dir before
      - name: Time v0.1.0 portable startup
        id: before
        continue-on-error: true
        shell: pwsh
        run: |
          Unblock-File -LiteralPath before/Multiclient.exe
          node scripts/time-startup.cjs before/Multiclient.exe timing-before.json
      - name: Install dependencies
        shell: bash
        run: npm ci
      - name: Build
        run: npm run build
      - name: Package Windows zip
        run: npx electron-builder --win zip --x64 --publish never
      - name: Time zip startup
        id: after
        continue-on-error: true
        shell: pwsh
        run: |
          Unblock-File -LiteralPath release/Multiclient-win-x64.zip
          node scripts/time-startup.cjs release/Multiclient-win-x64.zip timing-after.json
      - name: Show timings
        if: always()
        shell: pwsh
        run: |
          if (Test-Path timing-before.json) { Get-Content -Raw timing-before.json }
          if (Test-Path timing-after.json) { Get-Content -Raw timing-after.json }
          if ('${{ steps.before.outcome }}' -ne 'success' -or '${{ steps.after.outcome }}' -ne 'success') {
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-timing
          path: |
            timing-before.json
            timing-after.json
          if-no-files-found: warn
  # Branch pushes, pull requests, and workflow_dispatch do not match, so this job
  # is skipped. on: push has no branch filter, so a v* tag push still starts the
  # workflow and then runs this job after verify. The tag must already exist;
  # this job does not create one.
  release:
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: ${{ format('{0}\electron\Cache', env.LOCALAPPDATA) }}
          key: electron-Windows-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-Windows-
      - name: Install dependencies
        shell: bash
        run: |
          set -eu
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            echo "npm ci failed on attempt ${attempt}"
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            rm -rf node_modules
            sleep $((attempt * 5))
          done
      - name: Build
        run: npm run build
      - name: Package Windows zip
        run: npx electron-builder --win zip --x64 --publish never
      - name: Create release checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath release/Multiclient-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Multiclient-win-x64.zip" | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding ascii
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Multiclient ${{ github.ref_name }} preview
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/Multiclient-win-x64.zip
            release/SHA256SUMS.txt
          body: |
            Windows x64 preview. Download Multiclient-win-x64.zip and SHA256SUMS.txt. Extract the zip and run Multiclient.exe. An installer is not required.

            Verify the download in PowerShell:

            ```powershell
            Get-FileHash .\Multiclient-win-x64.zip -Algorithm SHA256
            ```

            The hash should match the first field of SHA256SUMS.txt from this release. Connect an official CLI subscription, an API key, or a separately installed compatible local server. Public execution modes remain gated pending certification.
