name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "const expected = 'v' + require('./package.json').version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error('Tag must match package.json version (' + expected + ')');"
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          # @electron/get via env-paths: ~/.cache/electron, ~/Library/Caches/electron,
          # and %LOCALAPPDATA%\electron\Cache. A transient HTTP 500 leaves the zip here.
          path: ${{ runner.os == 'Windows' && format('{0}\electron\Cache', env.LOCALAPPDATA) || (runner.os == 'macOS' && format('{0}/Library/Caches/electron', env.HOME) || format('{0}/.cache/electron', env.HOME)) }}
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-
      - name: Install dependencies
        shell: bash
        run: |
          set -eu
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            echo "npm ci failed on attempt ${attempt}"
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            rm -rf node_modules
            sleep $((attempt * 5))
          done
      - name: Configure Electron sandbox
        if: runner.os == 'Linux'
        run: |
          # Electron aborts unless chrome-sandbox is owned by root and mode 4755.
          # This is CI setup only. The smoke script does not pass --no-sandbox.
          sandbox="node_modules/electron/dist/chrome-sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      - name: Install a window manager
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openbox
      - run: npm run check
        if: runner.os != 'Linux'
      - name: Verify under a window manager
        if: runner.os == 'Linux'
        run: |
          # Xvfb alone does not implement EWMH, so BrowserWindow.maximize() never
          # reports isMaximized(). Openbox does, and the title-bar test depends on it.
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24" bash -c 'set -eu
            openbox >/tmp/openbox.log 2>&1 &
            for _ in $(seq 1 50); do
              if pgrep -x openbox >/dev/null; then break; fi
              sleep 0.1
            done
            pgrep -x openbox >/dev/null
            npm run check
          '
      - run: npm run pack
        if: runner.os != 'Windows'
      - name: Build Windows portable EXE
        if: runner.os == 'Windows'
        run: npx electron-builder --win portable --x64 --publish never
      - name: Verify packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MULTICLIENT_PACKAGED_PATH = Join-Path $PWD 'release/win-unpacked/Multiclient.exe'
          npx playwright test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify portable launcher and restart
        if: runner.os == 'Windows'
        run: node scripts/test-portable.cjs
      - name: Create checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath release/Multiclient.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Multiclient.exe" | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Multiclient-Windows-x64
          path: |
            release/Multiclient.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Multiclient-Windows-x64
          path: release
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          # This workflow produces unsigned builds, so every downloadable build is a preview.
          args=(--verify-tag --title "Multiclient $RELEASE_TAG preview" --generate-notes --prerelease)
          gh release create "$RELEASE_TAG" release/Multiclient.exe release/SHA256SUMS.txt "${args[@]}" --notes "Windows x64 portable preview. Download Multiclient.exe and run it; no installer is needed. This build is unsigned. Connect an official CLI subscription, an API key, or a separately installed compatible local server. Public execution modes remain gated pending certification."
