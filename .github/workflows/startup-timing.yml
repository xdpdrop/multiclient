name: Windows startup timing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  time:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: ${{ format('{0}\electron\Cache', env.LOCALAPPDATA) }}
          key: electron-Windows-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-Windows-
      - name: Download v0.1.0 portable EXE
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          mkdir -p before
          gh release download v0.1.0 --pattern Multiclient.exe --dir before
          gh release download v0.1.0 --pattern SHA256SUMS.txt --dir before
      - name: Time v0.1.0 portable startup
        id: before
        continue-on-error: true
        shell: pwsh
        run: |
          Unblock-File -LiteralPath before/Multiclient.exe
          node scripts/time-startup.cjs before/Multiclient.exe timing-before.json
      - name: Install dependencies
        shell: bash
        run: npm ci
      - name: Build
        run: npm run build
      - name: Package Windows zip
        run: npx electron-builder --win zip --x64 --publish never
      - name: Time zip startup
        id: after
        continue-on-error: true
        shell: pwsh
        run: |
          Unblock-File -LiteralPath release/Multiclient-win-x64.zip
          node scripts/time-startup.cjs release/Multiclient-win-x64.zip timing-after.json
      - name: Show timings
        if: always()
        shell: pwsh
        run: |
          if (Test-Path timing-before.json) { Get-Content -Raw timing-before.json }
          if (Test-Path timing-after.json) { Get-Content -Raw timing-after.json }
          if ('${{ steps.before.outcome }}' -ne 'success' -or '${{ steps.after.outcome }}' -ne 'success') {
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-timing
          path: |
            timing-before.json
            timing-after.json
          if-no-files-found: warn
